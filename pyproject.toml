[tool.poetry]
name = "powerplant-coding-challenge-clr"
packages = [{ include = "app" }]
version = "0.1.0"
description = ""
authors = ["Christian Lugo Ramírez"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.135.1"
uvicorn = "^0.41.0"
pydantic = "^2.12.5"
makefile = "^1.1.0"


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
ruff = "^0.15.5"
pre-commit = "^4.5.1"
httpx = "^0.28.1"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
